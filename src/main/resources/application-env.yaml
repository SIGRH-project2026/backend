server:
  port: ${API_PORT:9080}
  servlet:
    context-path: ${API_CONTEXT_PATH:/api/v1/mfpai}
  error:
    include-message: never
    include-stacktrace: never
spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: sigrh-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sigrh_new}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USERNAME:sigrh_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
app:
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}
  url:
    front: ${BACKOFFICE_URL:http://localhost:4300/#/auth/}
  file:
    regex-splitter: "@##___@##"
projet:
  securite:
    jwtSecret: ${JWT_SECRET}
    jwtExpiration: ${JWT_EXPIRATION_MS:900000}
    jwtRefreshToken: ${JWT_REFRESH_EXPIRATION_MS:86400000}
smtp:
  server:
    host: ${MAIL_HOST:localhost}
    from: ${MAIL_FROM:no-reply@example.test}
    password: ${MAIL_PASSWORD:}
upload:
  path: ${UPLOAD_PATH:./storage/files/}
  image: ${IMAGE_PATH:./storage/images/}
host:
  url: ${API_PUBLIC_URL:http://localhost:9080/api/v1/mfpai/}
url:
  logo:
    starterkit: ${LOGO_URL:http://localhost:4200/assets/images/logo.png}
maxSize: 20971520
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

interval: PT30S
cron: 0 0 0 1 * ?
